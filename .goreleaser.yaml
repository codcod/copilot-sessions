# goreleaser configuration for copilot-sessions. Validate with `just dist-check`;
# build a local, unpublished snapshot with `just dist-snapshot`.
# Real releases are cut by pushing a `vX.Y.Z` tag (see RELEASING.md).
version: 2

project_name: copilot-sessions

before:
  hooks:
    - go test ./...
    # Shell completion scripts for the .deb (nfpms contents below). Hooks run
    # without a shell, so the redirects need sh -c. completions/ is gitignored.
    - sh -c 'mkdir -p completions && go run ./cmd/copilot-sessions completion bash > completions/copilot-sessions.bash'
    - sh -c 'go run ./cmd/copilot-sessions completion zsh > completions/_copilot-sessions'
    - sh -c 'go run ./cmd/copilot-sessions completion fish > completions/copilot-sessions.fish'

builds:
  - id: copilot-sessions
    main: ./cmd/copilot-sessions
    binary: copilot-sessions
    env:
      - CGO_ENABLED=0
    # Linux only: status detection reads /proc (darwin: CS-009, windows: CS-010).
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: copilot-sessions
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

# Debian/Ubuntu packages (linux builds only), attached to the release. The
# release workflow then pushes them to the Cloudsmith apt repository
# codcod/copilot-sessions (see RELEASING.md).
nfpms:
  - id: copilot-sessions-deb
    package_name: copilot-sessions
    ids: [copilot-sessions]
    formats: [deb]
    vendor: codcod
    homepage: https://github.com/codcod/copilot-sessions
    maintainer: Nikos <nikos@linux.com>
    description: List, clean, back up and restore GitHub Copilot CLI sessions
    license: MIT
    bindir: /usr/bin
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}"
    contents:
      - src: completions/copilot-sessions.bash
        dst: /usr/share/bash-completion/completions/copilot-sessions
      - src: completions/_copilot-sessions
        dst: /usr/share/zsh/vendor-completions/_copilot-sessions
      - src: completions/copilot-sessions.fish
        dst: /usr/share/fish/vendor_completions.d/copilot-sessions.fish

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-snapshot"

# Pinned: goreleaser otherwise prefers GitLab whenever GITLAB_TOKEN is set.
release:
  github:
    owner: codcod
    name: copilot-sessions
  draft: false
  prerelease: auto
  # Overwrite existing artifacts on a re-run instead of failing with 422 already_exists.
  mode: replace

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
