name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: go fix
        run: go fix -diff ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      # Linux runner: the /proc tests run natively here (CI's `just test-linux`).
      - name: test
        run: go test ./...
      - name: build
        run: CGO_ENABLED=0 go build -o copilot-sessions ./cmd/copilot-sessions

  # Live-process tests use sysctl here. go fix and gofmt don't depend on the OS: build-test only.
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  # Live-process tests use Toolhelp32 + NtQueryInformationProcess here.
  test-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test ./...

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: '~> v2'
          install-only: true
      - name: goreleaser check
        run: goreleaser check
